<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="35%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="55%" stop-color="#FFF3E4"/>
      <stop offset="100%" stop-color="#FADFD2"/>
    </radialGradient>
    <radialGradient id="crust" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#F2C88B"/>
      <stop offset="100%" stop-color="#DFA560"/>
    </radialGradient>
    <radialGradient id="sauce" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#F7A89E"/>
      <stop offset="100%" stop-color="#EA877C"/>
    </radialGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#4A3B32" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Fundo opaco pastel -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Detalhes sutis de brilho no fundo -->
  <circle cx="96" cy="96" r="10" fill="#F4ACB7" opacity="0.5"/>
  <circle cx="422" cy="116" r="8" fill="#F6CD6A" opacity="0.65"/>
  <circle cx="104" cy="408" r="8" fill="#A8D5B5" opacity="0.65"/>
  <path d="M408 386 L414 402 L430 408 L414 414 L408 430 L402 414 L386 408 L402 402 Z" fill="#F6CD6A" opacity="0.8"/>
  <path d="M98 158 L102 170 L114 174 L102 178 L98 190 L94 178 L82 174 L94 170 Z" fill="#F4ACB7" opacity="0.75"/>

  <!-- Pizza fofa central -->
  <g filter="url(#shadow)">
    <!-- Prato / base suave -->
    <circle cx="256" cy="260" r="186" fill="#EED9C4"/>
    <!-- Borda da massa -->
    <circle cx="256" cy="254" r="172" fill="url(#crust)"/>
    <circle cx="256" cy="254" r="158" fill="none" stroke="#F8E2B8" stroke-width="5" opacity="0.85"/>
    <!-- Massa + molho -->
    <circle cx="256" cy="254" r="144" fill="#FBEBC9"/>
    <circle cx="256" cy="254" r="134" fill="url(#sauce)"/>

    <!-- Queijo derretido (manchas cremosas) -->
    <ellipse cx="206" cy="204" rx="28" ry="20" transform="rotate(-15 206 204)" fill="#FFF5CE"/>
    <ellipse cx="304" cy="216" rx="25" ry="18" transform="rotate(20 304 216)" fill="#FFF5CE"/>
    <ellipse cx="258" cy="264" rx="30" ry="22" transform="rotate(-8 258 264)" fill="#FFF5CE"/>
    <ellipse cx="196" cy="300" rx="24" ry="17" transform="rotate(18 196 300)" fill="#FFF5CE"/>
    <ellipse cx="310" cy="306" rx="26" ry="19" transform="rotate(-22 310 306)" fill="#FFF5CE"/>

    <!-- Calabresas fofas -->
    <g>
      <circle cx="252" cy="176" r="24" fill="#DC7268" stroke="#C45B52" stroke-width="3"/>
      <circle cx="245" cy="170" r="3.5" fill="#FBEBC9" opacity="0.85"/>
      <circle cx="261" cy="178" r="3" fill="#FBEBC9" opacity="0.85"/>
      <circle cx="249" cy="186" r="2.8" fill="#FBEBC9" opacity="0.85"/>

      <circle cx="182" cy="248" r="23" fill="#DC7268" stroke="#C45B52" stroke-width="3"/>
      <circle cx="176" cy="242" r="3.2" fill="#FBEBC9" opacity="0.85"/>
      <circle cx="190" cy="251" r="3" fill="#FBEBC9" opacity="0.85"/>
      <circle cx="179" cy="258" r="2.6" fill="#FBEBC9" opacity="0.85"/>

      <circle cx="328" cy="260" r="23" fill="#DC7268" stroke="#C45B52" stroke-width="3"/>
      <circle cx="322" cy="254" r="3.2" fill="#FBEBC9" opacity="0.85"/>
      <circle cx="336" cy="262" r="3" fill="#FBEBC9" opacity="0.85"/>
      <circle cx="326" cy="270" r="2.6" fill="#FBEBC9" opacity="0.85"/>

      <circle cx="250" cy="332" r="24" fill="#DC7268" stroke="#C45B52" stroke-width="3"/>
      <circle cx="243" cy="326" r="3.5" fill="#FBEBC9" opacity="0.85"/>
      <circle cx="258" cy="334" r="3" fill="#FBEBC9" opacity="0.85"/>
      <circle cx="247" cy="342" r="2.8" fill="#FBEBC9" opacity="0.85"/>
    </g>

    <!-- Folhinhas de manjericão -->
    <ellipse cx="292" cy="186" rx="14" ry="8" transform="rotate(-35 292 186)" fill="#8EC59E" stroke="#6FA880" stroke-width="2.5"/>
    <ellipse cx="212" cy="272" rx="14" ry="8" transform="rotate(28 212 272)" fill="#8EC59E" stroke="#6FA880" stroke-width="2.5"/>
    <ellipse cx="292" cy="312" rx="13" ry="7.5" transform="rotate(-22 292 312)" fill="#8EC59E" stroke="#6FA880" stroke-width="2.5"/>

    <!-- Linhas suaves de corte (detalhe fofo) -->
    <line x1="256" y1="112" x2="256" y2="396" stroke="#FFFFFF" stroke-width="3.5" stroke-dasharray="10 10" stroke-linecap="round" opacity="0.45"/>
    <line x1="114" y1="254" x2="398" y2="254" stroke="#FFFFFF" stroke-width="3.5" stroke-dasharray="10 10" stroke-linecap="round" opacity="0.45"/>

    <!-- Coraçãozinho marca registrada da Lele -->
    <g transform="translate(342, 134) rotate(12)">
      <path d="M0 10 C0 -2, 18 -6, 22 6 C26 -6, 44 -2, 44 10 C44 24, 22 38, 22 38 C22 38, 0 24, 0 10 Z"
            fill="#F4ACB7" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
