<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzaria Fofa · Protótipo Visual v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --creme:#FFF8F0;
    --pessego:#FDECE2;
    --madeira:#EED9C4;
    --madeira-escura:#E3C5A8;
    --sage:#D8E2DC;
    --rosa:#F4ACB7;
    --lavanda:#E2ECE9;
    --manteiga:#FFF1C1;
    --cafe:#4A3B32;
    --cafe-suave:#7A6559;
    --sombra:0 14px 30px -16px rgba(74,59,50,.35);
    --elastico:cubic-bezier(.34,1.56,.64,1);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

  body{
    font-family:'Quicksand',system-ui,sans-serif;
    color:var(--cafe);
    background:
      radial-gradient(circle at 15% 5%, #FFFFFF 0%, transparent 45%),
      radial-gradient(circle at 92% 95%, var(--pessego) 0%, transparent 55%),
      var(--creme);
    overflow:hidden;
  }

  h1,button,.brand,.client,.tab,.pot span,.box text{font-family:'Fredoka',sans-serif}

  .app{
    height:100vh;height:100dvh;
    display:grid;
    grid-template-columns:300px 1fr 330px;
    grid-template-rows:auto 1fr;
    gap:16px;
    padding:16px 20px;
  }

  /* ---------- Cabeçalho + barra de teste ---------- */
  .top{
    grid-column:1/-1;
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
  }
  .brand{font-weight:600;font-size:1.45rem;display:flex;gap:10px;align-items:center}

  .testbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .testbar > span{
    font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--cafe-suave);margin-right:4px;
  }
  .testbar button{
    border:1.5px dashed #D6B592;background:rgba(255,255,255,.7);
    border-radius:999px;padding:6px 12px;cursor:pointer;
    font-family:'Quicksand',sans-serif;font-weight:600;font-size:.85rem;color:var(--cafe);
    transition:transform .25s var(--elastico), background .2s;
  }
  .testbar button:hover{transform:translateY(-2px)}
  .testbar button.on{background:var(--sage);border:1.5px solid var(--sage)}

  .panel{
    background:rgba(255,255,255,.5);
    border-radius:24px;
    box-shadow:var(--sombra);
    padding:16px;
    min-height:0;
  }

  /* ---------- Balcão: comanda ---------- */
  .counter{display:flex;flex-direction:column;justify-content:space-between;overflow:auto}

  .comanda{
    position:relative;
    background-color:var(--manteiga);
    background-image:repeating-linear-gradient(transparent 0 27px,#EBD9A4 27px 28px);
    border-radius:18px;
    padding:20px 16px 16px;
    box-shadow:0 12px 22px -14px rgba(74,59,50,.45);
    transform:rotate(-1deg);
  }
  .comanda::before{
    content:'';position:absolute;top:-8px;left:50%;margin-left:-9px;
    width:18px;height:18px;border-radius:50%;
    background:var(--rosa);box-shadow:0 2px 0 rgba(74,59,50,.15);
  }
  .comanda-head{
    display:flex;justify-content:space-between;
    font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--cafe-suave);margin-bottom:6px;
  }

  .avatar{
    width:118px;height:118px;margin:6px auto 0;border-radius:50%;
    border:4px solid #fff;overflow:hidden;
    box-shadow:0 8px 16px -10px rgba(74,59,50,.45);
    transition:background .4s;
  }
  .avatar svg{width:100%;height:100%;display:block}

  /* Dupla: dois avatares lado a lado com brilhos entre eles */
  .duo{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
  .duo .avatar{width:96px;height:96px;margin:0}
  .sparkles{display:flex;flex-direction:column;align-items:center;gap:4px}
  .sparkles svg{width:18px;height:18px;animation:twinkle 2.4s ease-in-out infinite}
  .sparkles svg:nth-child(2){animation-delay:.6s;width:12px;height:12px}
  .sparkles svg:nth-child(3){animation-delay:1.2s}
  .sparkles .heart{width:22px;height:22px;animation:beat 2s ease-in-out infinite}
  @keyframes twinkle{
    0%,100%{transform:scale(.8) rotate(0);opacity:.6}
    50%{transform:scale(1.15) rotate(20deg);opacity:1}
  }
  @keyframes beat{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.15)}
  }
  .sparkles svg{transform-box:fill-box;transform-origin:center}

  .client{text-align:center;font-weight:600;font-size:1.2rem;margin-top:10px}

  .bubble{
    position:relative;background:#fff;border-radius:18px;
    padding:10px 13px;margin:14px 2px 0;
    font-size:.95rem;line-height:1.35;
    box-shadow:0 6px 14px -10px rgba(74,59,50,.4);
  }
  .bubble::before{
    content:'';position:absolute;top:-9px;left:50%;margin-left:-9px;
    border:9px solid transparent;border-top:none;border-bottom-color:#fff;
  }

  .items{list-style:none;margin-top:12px}
  .items li{
    display:flex;align-items:center;gap:10px;
    padding:7px 0;border-bottom:1.5px dashed #E3CF9A;
    font-weight:600;font-size:.95rem;transition:color .3s;
  }
  .items i{
    width:16px;height:16px;flex:none;border-radius:50%;
    border:2px solid var(--cafe-suave);background:transparent;
    transition:all .35s var(--elastico);
  }
  .items li.done{color:#5C8069}
  .items li.done i{background:#A8D5B5;border-color:#7FB58F;box-shadow:inset 0 0 0 3px #A8D5B5}
  .items em{
    font-style:normal;font-size:.7rem;margin-left:auto;
    background:var(--lavanda);border-radius:999px;padding:1px 7px;
  }

  .nav{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:14px}
  .pill{
    border:none;cursor:pointer;border-radius:999px;padding:9px 18px;
    background:var(--lavanda);color:var(--cafe);font-weight:600;font-size:.95rem;
    box-shadow:0 5px 0 rgba(74,59,50,.12);
    transition:transform .2s var(--elastico);
  }
  .pill:hover{transform:translateY(-2px)}
  .pill:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(74,59,50,.12)}

  /* ---------- Bancada ---------- */
  .bench{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    min-height:0;
  }
  .segmented{
    display:inline-flex;gap:4px;padding:4px;border-radius:999px;
    background:rgba(255,255,255,.6);box-shadow:0 6px 14px -10px rgba(74,59,50,.4);
  }
  .seg{
    border:none;cursor:pointer;background:transparent;border-radius:999px;
    padding:8px 14px;font-weight:600;font-size:.9rem;color:var(--cafe);
    font-family:'Quicksand',sans-serif;
    transition:transform .25s var(--elastico), background .2s;
  }
  .seg:hover{transform:translateY(-1px)}
  .seg.on{background:var(--rosa);box-shadow:0 3px 0 rgba(74,59,50,.12)}

  .table{
    position:relative;
    width:min(100%, 58dvh, 440px);
    aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #F7E9D8 0%, var(--madeira) 48%, var(--madeira-escura) 100%);
    box-shadow:inset 0 -10px 0 #D6B592, 0 24px 40px -22px rgba(74,59,50,.5);
    display:grid;place-items:center;
  }
  .table::before{
    content:'';position:absolute;inset:5%;border-radius:50%;pointer-events:none;
    background:repeating-linear-gradient(92deg, rgba(255,255,255,.14) 0 2px, transparent 2px 10px);
  }
  .pizza{
    width:92%;height:92%;
    filter:drop-shadow(0 10px 10px rgba(74,59,50,.18));
  }
  .hint{font-size:.9rem;color:var(--cafe-suave);font-weight:600;text-align:center}
  .actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

  .btn{
    border:none;cursor:pointer;border-radius:999px;
    padding:12px 24px;font-size:1rem;font-weight:600;color:var(--cafe);
    box-shadow:0 6px 0 rgba(74,59,50,.14), var(--sombra);
    transition:transform .2s var(--elastico), box-shadow .2s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(74,59,50,.14)}
  .btn-clear{background:var(--lavanda)}
  .btn-deliver{background:var(--rosa)}

  /* ---------- Potes ---------- */
  .pantry{display:flex;flex-direction:column;gap:12px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .tab{
    border:none;cursor:pointer;border-radius:14px;padding:9px 6px;
    background:rgba(255,255,255,.7);color:var(--cafe);font-size:.9rem;font-weight:600;
    transition:transform .25s var(--elastico), background .2s;
  }
  .tab:hover{transform:translateY(-2px)}
  .tab.on{background:var(--sage);box-shadow:inset 0 -3px 0 rgba(74,59,50,.12)}

  .pot-grid{
    flex:1;min-height:0;overflow:auto;
    display:grid;grid-template-columns:repeat(3,1fr);align-content:start;
    gap:10px;padding:6px 2px 8px;
  }
  .pot{
    position:relative;
    border:none;cursor:pointer;border-radius:20px;padding:8px 4px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:#fff;color:var(--cafe);
    box-shadow:0 6px 12px -8px rgba(74,59,50,.4);
    transition:transform .3s var(--elastico), box-shadow .25s;
  }
  .pot:hover{transform:translateY(-3px) rotate(-1.5deg)}
  .pot:active{transform:scale(.92)}
  .pot svg{width:60px;height:60px}
  .pot span{font-size:.72rem;font-weight:600;line-height:1.1;text-align:center}
  .pot[data-tab="bases"]{background:var(--sage)}
  .pot[data-tab="classicos"]{background:#FAD9DE}
  .pot[data-tab="especiais"]{background:var(--manteiga)}
  .pot[data-tab="doces"]{background:var(--lavanda)}
  .pot.on{box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--rosa), 0 6px 12px -8px rgba(74,59,50,.4)}
  .badge{
    position:absolute;top:-6px;right:-4px;
    background:#fff;color:var(--cafe);border:1.5px solid var(--rosa);
    font-family:'Fredoka',sans-serif;font-size:.62rem;font-weight:600;
    border-radius:999px;padding:1px 6px;
  }

  /* ---------- Animações ---------- */
  @keyframes pop{
    0%{transform:scale(0) rotate(-25deg);opacity:0}
    65%{transform:scale(1.2) rotate(4deg);opacity:1}
    100%{transform:scale(1) rotate(0)}
  }
  .pop{
    transform-box:fill-box;transform-origin:center;
    animation:pop .5s var(--elastico) both;
  }

  /* ---------- Caixa de entrega ---------- */
  .box-overlay{
    position:fixed;inset:0;z-index:10;
    display:grid;place-items:center;
    background:rgba(255,248,240,.8);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .box-overlay.show{opacity:1;pointer-events:all}
  .box svg{width:min(60vw,280px);height:auto;overflow:visible}
  @keyframes boxIn{
    from{transform:scale(.6) translateY(30px);opacity:0}
    to{transform:none;opacity:1}
  }
  @keyframes lidDown{
    from{transform:translateY(-80px) rotate(-18deg);opacity:0}
    to{transform:none;opacity:1}
  }
  .box-overlay.show .box{animation:boxIn .5s var(--elastico) both}
  .box-overlay.show .lid{
    transform-box:fill-box;transform-origin:center;
    animation:lidDown .6s .35s var(--elastico) both;
  }

  .toast{
    position:fixed;left:50%;bottom:24px;z-index:20;
    transform:translate(-50%,160px);
    background:#fff;border-radius:999px;padding:12px 22px;
    box-shadow:var(--sombra);font-family:'Fredoka',sans-serif;font-weight:500;
    transition:transform .45s var(--elastico);
    white-space:nowrap;
  }
  .toast.show{transform:translate(-50%,0)}

  /* ---------- Responsivo ---------- */
  @media (max-width:900px){
    body{overflow:auto}
    .app{height:auto;min-height:100dvh;grid-template-columns:1fr;grid-template-rows:auto}
    .counter{overflow:visible}
    .comanda{max-width:360px;width:100%;margin:0 auto}
    .table{width:min(88vw,400px)}
    .pot-grid{overflow:visible}
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" width="36" height="36" aria-hidden="true">
        <circle cx="20" cy="20" r="18" fill="#F4ACB7"/>
        <circle cx="20" cy="20" r="13" fill="#FFF1C1"/>
        <path d="M20 20 L20 7 A13 13 0 0 1 31.3 26.5Z" fill="#F4ACB7"/>
        <circle cx="16" cy="18" r="2" fill="#D8E2DC"/>
        <circle cx="24" cy="24" r="2" fill="#D8E2DC"/>
      </svg>
      Pizzaria Fofa
    </div>

    <!-- Barra de teste: alterna o tipo de cliente -->
    <nav class="testbar" id="testbar">
      <span>Teste</span>
      <button data-modo="random" class="on">Cliente Aleatório</button>
      <button data-modo="arthur">Arthur</button>
      <button data-modo="leticia">Letícia</button>
      <button data-modo="dupla">Arthur &amp; Letícia</button>
    </nav>
  </header>

  <aside class="counter panel">
    <div class="comanda">
      <div class="comanda-head"><span id="ticket"></span><span>Comanda</span></div>
      <div id="avatarArea"></div>
      <div class="client" id="client"></div>
      <div class="bubble" id="say"></div>
      <ul class="items" id="items"></ul>
    </div>
    <div class="nav">
      <button class="pill" id="nextClient">Trocar cliente ›</button>
    </div>
  </aside>

  <section class="bench">
    <div class="segmented" id="modo">
      <button class="seg on" data-at="full">Pizza Inteira</button>
      <button class="seg" data-at="left">Metade Esquerda</button>
      <button class="seg" data-at="right">Metade Direita</button>
    </div>
    <div class="table"><div id="board" style="width:100%;height:100%;display:grid;place-items:center"></div></div>
    <p class="hint">Escolha a área acima e toque nos potes. Toque de novo para tirar.</p>
    <div class="actions">
      <button class="btn btn-clear" id="clear">Limpar Massa</button>
      <button class="btn btn-deliver" id="deliver">Finalizar / Entregar Pizza</button>
    </div>
  </section>

  <aside class="pantry panel">
    <div class="tabs" id="tabs"></div>
    <div class="pot-grid" id="pots"></div>
  </aside>
</div>

<div class="box-overlay" id="boxOverlay">
  <div class="box">
    <svg viewBox="0 0 220 180" aria-hidden="true">
      <rect x="22" y="78" width="176" height="84" rx="12" fill="#F6E7D0" stroke="#D9BF9C" stroke-width="3"/>
      <rect x="40" y="96" width="140" height="10" rx="5" fill="#EFD9BC"/>
      <circle cx="110" cy="132" r="22" fill="#F4ACB7"/>
      <text x="110" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#4A3B32">Fofa</text>
      <g class="lid">
        <rect x="16" y="38" width="188" height="42" rx="10" fill="#FFF1C1" stroke="#E6D29B" stroke-width="3"/>
        <text x="110" y="64" text-anchor="middle" font-size="16" font-weight="600" fill="#4A3B32">Pizzaria Fofa</text>
      </g>
    </svg>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   1. CONFIGURAÇÃO DOS AVATARES VIP
   Edite as cores e estilos aqui. Cada bloco está marcado
   por parte do corpo/acessório para facilitar a customização.
   ========================================================= */

// ---------- ARTHUR ----------
const ARTHUR_CFG = {
  // PELE
  pele:         '#F3CBA8',
  // CABELO
  cabelo:       '#5A4032',   // cor do cabelo
  estiloCabelo: 'espetado',  // 'espetado' | 'liso'
  // OLHOS
  olhos:        '#4A3B32',   // cor da íris
  // ÓCULOS / ACESSÓRIOS
  oculos:       true,        // true = usa óculos redondos
  corOculos:    '#7A6559',   // cor da armação
  // ROUPA
  roupa:        '#A8D5B5',   // cor da camiseta
  // FUNDO DO AVATAR
  bg:           '#E2ECE9',
};

// ---------- LETÍCIA ----------
const LETICIA_CFG = {
  // PELE
  pele:         '#F6D3B6',
  // CABELO
  cabelo:       '#8C5A3C',   // cor do cabelo
  ondulado:     true,        // true = comprido ondulado, false = liso na altura dos ombros
  // OLHOS
  olhos:        '#5B4336',   // cor da íris
  cilios:       true,        // true = desenha cílios
  // ACESSÓRIOS
  laco:         '#F4ACB7',   // cor do laço no cabelo (null = sem laço)
  brinco:       '#FFF1C1',   // cor dos brincos (null = sem brincos)
  // ROUPA
  roupa:        '#D9CCE8',   // cor da blusa
  // FUNDO DO AVATAR
  bg:           '#FDECE2',
};

/* ---------- Desenho do ARTHUR ---------- */
function drawArthur(c = ARTHUR_CFG){
  // CABELO DE TRÁS
  const cabeloTras = `<path d="M34 54Q32 24 60 24Q88 24 86 54L86 62Q60 50 34 62Z" fill="${c.cabelo}"/>`;

  // ROUPA (camiseta)
  const roupa = `
    <path d="M16 120Q18 88 60 86Q102 88 104 120Z" fill="${c.roupa}"/>
    <path d="M50 88L60 98L70 88" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".7"/>`;

  // PESCOÇO
  const pescoco = `<rect x="52" y="76" width="16" height="16" rx="6" fill="${c.pele}"/>`;

  // ROSTO
  const rosto = `<ellipse cx="60" cy="56" rx="25" ry="27" fill="${c.pele}"/>`;

  // CABELO DA FRENTE
  const cabeloFrente = c.estiloCabelo === 'espetado'
    ? `<path d="M36 46L42 30L50 40L56 26L62 38L70 27L74 40L84 34L82 48Q60 40 36 46Z" fill="${c.cabelo}"/>`
    : `<path d="M35 50Q36 30 60 30Q84 30 85 50Q70 40 60 42Q48 42 35 50Z" fill="${c.cabelo}"/>`;

  // OLHOS (com brilho)
  const olhos = `
    <ellipse cx="51" cy="57" rx="2.6" ry="3.2" fill="${c.olhos}"/>
    <ellipse cx="69" cy="57" rx="2.6" ry="3.2" fill="${c.olhos}"/>
    <circle cx="51.9" cy="55.8" r=".9" fill="#fff"/>
    <circle cx="69.9" cy="55.8" r=".9" fill="#fff"/>`;

  // ÓCULOS
  const oculos = c.oculos ? `
    <g fill="none" stroke="${c.corOculos}" stroke-width="1.6">
      <circle cx="51" cy="57" r="6.5"/>
      <circle cx="69" cy="57" r="6.5"/>
      <path d="M57.5 57H62.5"/>
    </g>` : '';

  // BOCHECHAS E SORRISO
  const detalhes = `
    <ellipse cx="43" cy="66" rx="5" ry="3" fill="#F4ACB7" opacity=".7"/>
    <ellipse cx="77" cy="66" rx="5" ry="3" fill="#F4ACB7" opacity=".7"/>
    <path d="M53 68Q60 74 67 68" stroke="${c.olhos}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;

  return `<svg viewBox="0 0 120 120" aria-hidden="true">
    ${roupa}${cabeloTras}${pescoco}${rosto}${cabeloFrente}${olhos}${oculos}${detalhes}
  </svg>`;
}

/* ---------- Desenho da LETÍCIA ---------- */
function drawLeticia(c = LETICIA_CFG){
  // CABELO DE TRÁS (ondulado comprido ou liso)
  const cabeloTras = `<path d="${c.ondulado
      ? 'M31 62Q26 98 38 106Q48 100 60 106Q72 100 82 106Q94 98 89 62Q88 22 60 22Q32 22 31 62Z'
      : 'M32 60Q30 40 60 22Q90 40 88 60L88 96L32 96Z'}" fill="${c.cabelo}"/>`;

  // ROUPA (blusa)
  const roupa = `
    <path d="M18 120Q20 88 60 86Q100 88 102 120Z" fill="${c.roupa}"/>
    <path d="M46 88Q60 104 74 88" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".6"/>`;

  // PESCOÇO
  const pescoco = `<rect x="52" y="76" width="16" height="16" rx="6" fill="${c.pele}"/>`;

  // ROSTO
  const rosto = `<ellipse cx="60" cy="56" rx="25" ry="27" fill="${c.pele}"/>`;

  // FRANJA LATERAL
  const franja = `<path d="M34 56Q34 30 60 28Q86 30 86 56Q80 42 68 40Q52 46 34 56Z" fill="${c.cabelo}"/>`;

  // LAÇO (acessório de cabelo)
  const laco = c.laco ? `
    <g fill="${c.laco}" stroke="#fff" stroke-width=".8">
      <path d="M84 34L94 27L94 41Z"/>
      <path d="M84 34L74 27L74 41Z"/>
      <circle cx="84" cy="34" r="3"/>
    </g>` : '';

  // BRINCOS
  const brincos = c.brinco ? `
    <circle cx="34" cy="72" r="2.6" fill="${c.brinco}" stroke="#E6D29B" stroke-width=".6"/>
    <circle cx="86" cy="72" r="2.6" fill="${c.brinco}" stroke="#E6D29B" stroke-width=".6"/>` : '';

  // OLHOS (com brilho e cílios opcionais)
  const olhos = `
    <ellipse cx="51" cy="57" rx="2.4" ry="3" fill="${c.olhos}"/>
    <ellipse cx="69" cy="57" rx="2.4" ry="3" fill="${c.olhos}"/>
    <circle cx="51.8" cy="55.9" r=".9" fill="#fff"/>
    <circle cx="69.8" cy="55.9" r=".9" fill="#fff"/>
    ${c.cilios ? `

/* =========================================================
   3. UTILITÁRIOS: gerador determinístico e desenho dos sprites
   ========================================================= */

const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// Gerador pseudoaleatório com semente (mesma semente = mesmo arranjo)
function seeded(str){
  let s = 0;
  for (const c of str) s = (Math.imul(s, 31) + c.charCodeAt(0)) | 0;
  return () => {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Desenho de cada ingrediente, centralizado em (0,0)
function sprite(type, color, r){
  switch(type){
    case 'blob':
      return `<ellipse rx="${(7 + r()*4).toFixed(1)}" ry="${(5 + r()*3).toFixed(1)}" fill="${color}" stroke="#E6D3B8" stroke-width=".9"/>`;
    case 'slice':
      return `<circle r="7" fill="${color}" stroke="#C4705E" stroke-width="1.2"/>
              <circle cx="-2.5" cy="-1.5" r="1.1" fill="#B8604E"/>
              <circle cx="2.5" cy="1.8" r="1.1" fill="#B8604E"/>
              <circle cx="1" cy="-3.2" r=".9" fill="#B8604E"/>`;
    case 'leaf':
      return `<path d="M-8 0Q0-9 8 0Q0 9-8 0Z" fill="${color}" stroke="#86B895" stroke-width=".8"/>
              <path d="M-6 0H6" stroke="#86B895" stroke-width=".7"/>`;
    case 'cherry':
      return `<circle r="6" fill="${color}"/><circle cx="-2" cy="-2" r="1.8" fill="#fff" opacity=".6"/>`;
    case 'stick':
      return `<rect x="-9" y="-2.2" width="18" height="4.4" rx="1.6" fill="${color}" stroke="#D9A94A" stroke-width=".8"/>`;
    case 'drip':
      return `<path d="M-8-4Q0-8 8-4Q8 4 4 8Q0 2-4 8Q-8 4-8-4Z" fill="${color}"/>`;
    case 'bacon':
      return `<rect x="-8" y="-3.2" width="16" height="6.4" rx="3" fill="${color}" stroke="#C97B78" stroke-width=".8"/>
              <path d="M-4-3V3M0-3V3M4-3V3" stroke="#C97B78" stroke-width=".7" opacity=".7"/>`;
    case 'cube':
      return `<rect x="-5" y="-5" width="10" height="10" rx="2.4" fill="${color}" stroke="#E07F63" stroke-width=".9"/>`;
    case 'rod':
      return `<rect x="-8" y="-1.4" width="16" height="2.8" rx="1.4" fill="${color}"/>`;
    case 'seed':
      return `<ellipse rx="3" ry="2" fill="${color}" stroke="#E0C49A" stroke-width=".5"/>`;
    case 'drizzle':
      return `<path d="M-14 0Q-7-6 0 0T14 0" fill="none" stroke="${color}" stroke-width="3.4" stroke-linecap="round"/>`;
    case 'grape':
      return `<circle r="4.6" fill="${color}" stroke="#8DBA7A" stroke-width=".8"/>
              <circle cx="-1.5" cy="-1.5" r="1" fill="#fff" opacity=".6"/>`;
    case 'berry':
      return `<path d="M0-6Q6-8 7 0Q6 7 0 8Q-6 7-7 0Q-6-8 0-6Z" fill="${color}"/>
              <circle cx="-3" cy="-1" r=".7" fill="#fff"/><circle cx="2" cy="1" r=".7" fill="#fff"/>`;
    default:
      return '';
  }
}

// Posições de um ingrediente numa área: 'full' (pizza toda), 'left' ou 'right'
function placements(id, at){
  const it = ITEMS[id];
  const r = seeded(id + '|' + at);
  const base = it.count ?? 9;
  const n = at === 'full' ? base : Math.max(3, Math.round(base * 0.6));
  const out = [];
  for (let i = 0; i < n; i++){
    let ang;
    if (at === 'left')       ang = Math.PI/2 + r() * Math.PI;   // lado esquerdo (x < 200)
    else if (at === 'right') ang = -Math.PI/2 + r() * Math.PI;  // lado direito (x > 200)
    else                     ang = r() * Math.PI * 2;
    const dist = Math.sqrt(r()) * 128;
    out.push({
      x: 200 + Math.cos(ang) * dist,
      y: 200 + Math.sin(ang) * dist,
      rot: r() * 360,
      s: (it.scale ?? 1) * (0.85 + r() * 0.35),
      sp: sprite(it.sprite, it.color, r),
    });
  }
  return out;
}

// Ícone de cada pote
function potArt(it){
  const body = it.layer === 'base'
    ? `<circle r="8" fill="${it.color}" stroke="#D8C3A8" stroke-width="1"/>`
    : sprite(it.sprite, it.color, seeded(it.sprite + it.name));
  return `
    <path d="M-19-2H19Q18 16 0 17Q-18 16-19-2Z" fill="#fff" stroke="#D8C3A8" stroke-width="1.2"/>
    <ellipse cx="0" cy="-2" rx="19" ry="3.5" fill="#EFE3D2"/>
    <g transform="translate(0 -3) scale(1.25)">${body}</g>`;
}

/* =========================================================
   4. ESTADO
   Cada ingrediente na pizza é uma chave "id|área",
   onde área = 'full' | 'left' | 'right'.
   ========================================================= */

const state = {
  board: new Set(),      // chaves "id|área"
  at: 'full',            // área selecionada: inteira / esquerda / direita
  modo: 'random',        // tipo de cliente selecionado na barra de teste
  visita: null,          // cliente e pedido atuais
  visitas: 0,            // contador para o nº da comanda
  tab: 'bases',          // aba aberta na despensa
  fresh: null,           // última chave adicionada (para animação)
};

const keyOf = (id, at) => `${id}|${at}`;
const parse = k => { const [id, at] = k.split('|'); return { id, at }; };
const halvesOf = id => [...state.board].map(parse).filter(e => e.id === id).map(e => e.at);

function badgeText(ats){
  if (ats.includes('full')) return 'Todo';
  if (ats.includes('left') && ats.includes('right')) return 'E+D';
  return ats[0] === 'left' ? 'E' : 'D';
}

// Pizza em camadas: massa → base (inteira ou metades) → queijos → coberturas → divisória
function renderTable(){
  const entries = [...state.board].map(parse);
  const bases   = entries.filter(e => ITEMS[e.id].layer === 'base');
  const cheese  = entries.filter(e => ITEMS[e.id].layer === 'queijo');
  const tops    = entries.filter(e => ITEMS[e.id].layer === 'cobertura');

  const baseFull = bases.find(e => e.at === 'full');
  const baseL    = bases.find(e => e.at === 'left');
  const baseR    = bases.find(e => e.at === 'right');

  let baseSvg = '';
  if (baseFull){
    baseSvg = `<circle cx="200" cy="200" r="150" fill="${ITEMS[baseFull.id].color}"/>`;
  } else {
    if (baseL) baseSvg += `<path d="M200 50A150 150 0 0 0 200 350Z" fill="${ITEMS[baseL.id].color}"/>`;
    if (baseR) baseSvg += `<path d="M200 50A150 150 0 0 1 200 350Z" fill="${ITEMS[baseR.id].color}"/>`;
  }
  if (baseSvg) baseSvg += `<circle cx="200" cy="200" r="150" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="6"/>`;

  const stack = list => list.map(({ id, at }) => {
    const k = keyOf(id, at);
    return placements(id, at).map((p, i) => `
      <g transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)}) rotate(${p.rot.toFixed(0)}) scale(${p.s.toFixed(2)})">
        <g class="${k === state.fresh ? 'pop' : ''}" style="animation-delay:${i * 35}ms">${p.sp}</g>
      </g>`).join('');
  }).join('');

  const divisoria = entries.some(e => e.at !== 'full')
    ? `<line x1="200" y1="36" x2="200" y2="364" stroke="#fff" stroke-opacity=".8" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>`
    : '';

  $board.innerHTML = `
    <svg class="pizza" viewBox="0 0 400 400" role="img" aria-label="Pizza em montagem">
      <defs>
        <radialGradient id="massa" cx=".4" cy=".35" r=".7">
          <stop offset="0" stop-color="#FBEBC9"/>
          <stop offset="1" stop-color="#F0D29B"/>
        </radialGradient>
      </defs>
      <circle cx="200" cy="200" r="190" fill="#E7B878"/>
      <circle cx="200" cy="200" r="178" fill="none" stroke="#F6DDB0" stroke-width="4" opacity=".8"/>
      <circle cx="200" cy="200" r="168" fill="url(#massa)"/>
      ${baseSvg}
      <g>${stack(cheese)}</g>
      <g>${stack(tops)}</g>
      ${divisoria}
    </svg>`;
}

// Cria uma nova visita conforme o tipo de cliente
function novaVisita(modo){
  let visita;
  if (modo === 'random'){
    const c = pick(RANDOM_CLIENTS);
    visita = { tipo:'random', nome:c.nome, look:c.look, pedido:pick(c.pedidos) };
  } else if (modo === 'arthur'){
    visita = { tipo:'arthur', nome:CLIENTES_VIP.arthur.nome, pedido:pick(CLIENTES_VIP.arthur.pedidos) };
  } else if (modo === 'leticia'){
    visita = { tipo:'leticia', nome:CLIENTES_VIP.leticia.nome, pedido:pick(CLIENTES_VIP.leticia.pedidos) };
  } else {
    visita = { tipo:'dupla', nome:CLIENTES_VIP.dupla.nome, pedido:pick(CLIENTES_VIP.dupla.pedidos) };
  }
  state.modo = modo;
  state.visita = visita;
  state.visitas++;
  state.board.clear();
  state.fresh = null;
  render();
}

// Liga ou desliga um ingrediente na área selecionada
function toggle(id){
  const at = state.at;
  const k = keyOf(id, at);

  if (state.board.has(k)){
    state.board.delete(k);
  } else {
    // Bases cobrem a massa: removem as bases que se sobrepõem à área
    if (ITEMS[id].layer === 'base'){
      for (const e of [...state.board].map(parse)){
        if (ITEMS[e.id].layer === 'base' &&
            (e.at === 'full' || at === 'full' || e.at === at)){
          state.board.delete(keyOf(e.id, e.at));
        }
      }
    }
    state.board.add(k);
    state.fresh = k;
  }
  render();
  state.fresh = null;
}

function clearBoard(){
  state.board.clear();
  render();
}

let toastTimer;
function toast(msg){
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove('show'), 2400);
}

function deliver(){
  if (!state.board.size) return toast('A massa ainda está vazia. Que tal um molho?');
  const name = state.visita.nome;
  $overlay.classList.add('show');
  setTimeout(() => {
    $overlay.classList.remove('show');
    clearBoard();
    toast(`Pizza entregue para ${name}! ♡`);
  }, 2000);
}

/* =========================================================
   7. EVENTOS
   ========================================================= */

$pots.addEventListener('click', e => {
  const b = e.target.closest('.pot');
  if (b) toggle(b.dataset.id);
});

$tabs.addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (b){
    state.tab = b.dataset.tab;
    render();
  }
});

$modo.addEventListener('click', e => {
  const b = e.target.closest('.seg');
  if (b){
    state.at = b.dataset.at;
    renderSegmented();
  }
});

$testbar.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) novaVisita(b.dataset.modo);
});

$('nextClient').addEventListener('click', () => novaVisita(state.modo));
$('clear').addEventListener('click', clearBoard);
$('deliver').addEventListener('click', deliver);

novaVisita('random');
</script>
</body>
</html>
