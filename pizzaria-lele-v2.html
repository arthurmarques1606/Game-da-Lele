<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF8F0">
<meta name="mobile-web-app-capable" content="yes">
<title>Lele's Pizzaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --creme:#FFF8F0;
    --pessego:#FDECE2;
    --madeira:#EED9C4;
    --madeira-escura:#E3C5A8;
    --sage:#D8E2DC;
    --rosa:#F4ACB7;
    --lavanda:#E2ECE9;
    --manteiga:#FFF1C1;
    --cafe:#4A3B32;
    --cafe-suave:#7A6559;
    --sombra:0 14px 30px -16px rgba(74,59,50,.35);
    --elastico:cubic-bezier(.34,1.56,.64,1);
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}

  body{
    font-family:'Quicksand',system-ui,sans-serif;
    color:var(--cafe);
    background:
      radial-gradient(circle at 15% 5%, #FFFFFF 0%, transparent 45%),
      radial-gradient(circle at 92% 95%, var(--pessego) 0%, transparent 55%),
      var(--creme);
    overflow:hidden;
    user-select:none;-webkit-user-select:none;
  }

  button,.brand,.client,.tab,.pot span,.badge,.start-title,.start-btn,.toast,.rotate-title,.rotate-btn{font-family:'Fredoka',sans-serif}

  /* ---------- Layout do jogo ---------- */
  .app{
    height:100vh;height:100dvh;
    display:grid;
    grid-template-columns:300px 1fr 330px;
    grid-template-rows:auto 1fr;
    gap:16px;
    padding:16px 20px;
    transition:opacity .6s ease, transform .6s var(--elastico);
  }
  .app.hidden{opacity:0;transform:scale(.98);pointer-events:none}

  .top{
    grid-column:1/-1;
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;flex-wrap:wrap;
  }
  .brand{font-weight:600;font-size:1.45rem;display:flex;gap:10px;align-items:center}

  .panel{
    background:rgba(255,255,255,.5);
    border-radius:24px;
    box-shadow:var(--sombra);
    padding:16px;
    min-height:0;
  }

  /* ---------- Balcão: comanda + botão fixo embaixo ---------- */
  .counter{
    display:flex;flex-direction:column;
    min-height:0;overflow:hidden;
  }
  .comanda-wrap{
    flex:1;min-height:0;
    overflow:auto;
    padding:2px 4px 4px;
  }

  .comanda{
    position:relative;
    background-color:var(--manteiga);
    background-image:repeating-linear-gradient(transparent 0 27px,#EBD9A4 27px 28px);
    border-radius:18px;
    padding:20px 16px 16px;
    box-shadow:0 12px 22px -14px rgba(74,59,50,.45);
    transform:rotate(-1deg);
  }
  .comanda::before{
    content:'';position:absolute;top:-8px;left:50%;margin-left:-9px;
    width:18px;height:18px;border-radius:50%;
    background:var(--rosa);box-shadow:0 2px 0 rgba(74,59,50,.15);
  }
  .comanda-head{
    display:flex;justify-content:space-between;
    font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--cafe-suave);margin-bottom:6px;
  }

  .avatar{
    width:118px;height:118px;margin:6px auto 0;border-radius:50%;
    border:4px solid #fff;overflow:hidden;
    box-shadow:0 8px 16px -10px rgba(74,59,50,.45);
    transition:background .4s;
  }
  .avatar svg{width:100%;height:100%;display:block}

  .duo{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
  .duo .avatar{width:96px;height:96px;margin:0}
  .sparkles{display:flex;flex-direction:column;align-items:center;gap:4px}
  .sparkles svg{width:18px;height:18px;animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  .sparkles svg:nth-child(2){animation-delay:.6s;width:12px;height:12px}
  .sparkles svg:nth-child(3){animation-delay:1.2s}
  .sparkles .heart{width:22px;height:22px;animation:beat 2s ease-in-out infinite}
  @keyframes twinkle{
    0%,100%{transform:scale(.8) rotate(0);opacity:.6}
    50%{transform:scale(1.15) rotate(20deg);opacity:1}
  }
  @keyframes beat{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.15)}
  }

  .skins{margin-top:10px}
  .skin-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin-top:6px}
  .skin-row > span{
    width:100%;text-align:center;
    font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--cafe-suave);
  }
  .skin-pill{
    border:1.5px dashed #D6B592;background:#fff;border-radius:999px;
    padding:4px 10px;cursor:pointer;
    font-family:'Quicksand',sans-serif;font-weight:600;font-size:.78rem;color:var(--cafe);
    transition:transform .25s var(--elastico), background .2s;
  }
  .skin-pill:hover{transform:translateY(-2px)}
  .skin-pill.on{background:var(--rosa);border:1.5px solid var(--rosa)}

  .client{text-align:center;font-weight:600;font-size:1.2rem;margin-top:10px}

  .bubble{
    position:relative;background:#fff;border-radius:18px;
    padding:10px 13px;margin:14px 2px 0;
    font-size:.95rem;line-height:1.35;
    box-shadow:0 6px 14px -10px rgba(74,59,50,.4);
  }
  .bubble::before{
    content:'';position:absolute;top:-9px;left:50%;margin-left:-9px;
    border:9px solid transparent;border-top:none;border-bottom-color:#fff;
  }

  .items{list-style:none;margin-top:12px}
  .items li{
    display:flex;align-items:center;gap:10px;
    padding:7px 0;border-bottom:1.5px dashed #E3CF9A;
    font-weight:600;font-size:.95rem;transition:color .3s;
  }
  .items i{
    width:16px;height:16px;flex:none;border-radius:50%;
    border:2px solid var(--cafe-suave);background:transparent;
    transition:all .35s var(--elastico);
  }
  .items li.done{color:#5C8069}
  .items li.done i{background:#A8D5B5;border-color:#7FB58F;box-shadow:inset 0 0 0 3px #A8D5B5}
  .items em{
    font-style:normal;font-size:.7rem;margin-left:auto;
    background:var(--lavanda);border-radius:999px;padding:1px 7px;
  }

  .nav{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    padding-top:10px;flex:none;
  }
  .pill{
    border:none;cursor:pointer;border-radius:999px;padding:9px 18px;
    background:var(--lavanda);color:var(--cafe);font-weight:600;font-size:.95rem;
    box-shadow:0 5px 0 rgba(74,59,50,.12);
    transition:transform .2s var(--elastico);
  }
  .pill:hover{transform:translateY(-2px)}
  .pill:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(74,59,50,.12)}

  /* ---------- Bancada ---------- */
  .bench{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    min-height:0;
  }
  .segmented{
    display:inline-flex;gap:4px;padding:4px;border-radius:999px;
    background:rgba(255,255,255,.6);box-shadow:0 6px 14px -10px rgba(74,59,50,.4);
  }
  .seg{
    border:none;cursor:pointer;background:transparent;border-radius:999px;
    padding:8px 14px;font-weight:600;font-size:.9rem;color:var(--cafe);
    font-family:'Quicksand',sans-serif;
    transition:transform .25s var(--elastico), background .2s;
  }
  .seg:hover{transform:translateY(-1px)}
  .seg.on{background:var(--rosa);box-shadow:0 3px 0 rgba(74,59,50,.12)}

  .table{
    position:relative;
    width:min(100%, 58dvh, 440px);
    aspect-ratio:1;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #F7E9D8 0%, var(--madeira) 48%, var(--madeira-escura) 100%);
    box-shadow:inset 0 -10px 0 #D6B592, 0 24px 40px -22px rgba(74,59,50,.5);
    display:grid;place-items:center;
  }
  .table::before{
    content:'';position:absolute;inset:5%;border-radius:50%;pointer-events:none;
    background:repeating-linear-gradient(92deg, rgba(255,255,255,.14) 0 2px, transparent 2px 10px);
  }

  #board{
    width:100%;height:100%;
    display:grid;place-items:center;
    touch-action:none;
    cursor:crosshair;
  }
  #board.no-active{cursor:default}
  .pizza{
    width:92%;height:92%;
    filter:drop-shadow(0 10px 10px rgba(74,59,50,.18));
    pointer-events:none;
  }

  .hint{font-size:.9rem;color:var(--cafe-suave);font-weight:600;text-align:center;min-height:1.2em}
  .actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}

  .btn{
    border:none;cursor:pointer;border-radius:999px;
    padding:12px 24px;font-size:1rem;font-weight:600;color:var(--cafe);
    box-shadow:0 6px 0 rgba(74,59,50,.14), var(--sombra);
    transition:transform .2s var(--elastico), box-shadow .2s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(74,59,50,.14)}
  .btn-clear{background:var(--lavanda)}
  .btn-deliver{background:var(--rosa)}

  /* ---------- Potes ---------- */
  .pantry{display:flex;flex-direction:column;gap:12px}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .tab{
    border:none;cursor:pointer;border-radius:14px;padding:9px 6px;
    background:rgba(255,255,255,.7);color:var(--cafe);font-size:.9rem;font-weight:600;
    transition:transform .25s var(--elastico), background .2s;
  }
  .tab:hover{transform:translateY(-2px)}
  .tab.on{background:var(--sage);box-shadow:inset 0 -3px 0 rgba(74,59,50,.12)}

  .pot-grid{
    flex:1;min-height:0;overflow:auto;
    display:grid;grid-template-columns:repeat(3,1fr);align-content:start;
    gap:10px;padding:6px 2px 8px;
  }
  .pot{
    position:relative;
    border:none;cursor:pointer;border-radius:20px;padding:8px 4px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    background:#fff;color:var(--cafe);
    box-shadow:0 6px 12px -8px rgba(74,59,50,.4);
    transition:transform .3s var(--elastico), box-shadow .25s;
  }
  .pot:hover{transform:translateY(-3px) rotate(-1.5deg)}
  .pot:active{transform:scale(.92)}
  .pot svg{width:60px;height:60px;pointer-events:none}
  .pot span{font-size:.72rem;font-weight:600;line-height:1.1;text-align:center;pointer-events:none}
  .pot[data-tab="bases"]{background:var(--sage)}
  .pot[data-tab="classicos"]{background:#FAD9DE}
  .pot[data-tab="especiais"]{background:var(--manteiga)}
  .pot[data-tab="doces"]{background:var(--lavanda)}
  .pot.on{box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--rosa), 0 6px 12px -8px rgba(74,59,50,.4)}
  .pot.active{
    box-shadow:0 0 0 3px #fff, 0 0 0 6px var(--cafe-suave), 0 10px 18px -8px rgba(74,59,50,.5);
    transform:translateY(-3px);
    animation:breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:translateY(-3px) scale(1)}
    50%{transform:translateY(-3px) scale(1.04)}
  }
  .badge{
    position:absolute;top:-6px;right:-4px;
    background:#fff;color:var(--cafe);border:1.5px solid var(--rosa);
    font-size:.62rem;font-weight:600;
    border-radius:999px;padding:1px 6px;pointer-events:none;
  }

  /* ---------- Animações dos ingredientes ---------- */
  @keyframes pop{
    0%{transform:scale(0) rotate(-25deg);opacity:0}
    65%{transform:scale(1.2) rotate(4deg);opacity:1}
    100%{transform:scale(1) rotate(0)}
  }
  .pop{
    transform-box:fill-box;transform-origin:center;
    animation:pop .5s var(--elastico) both;
  }
  @keyframes spread{
    from{transform:scale(.4);opacity:0}
    to{transform:scale(1);opacity:1}
  }
  .spread{
    transform-box:fill-box;transform-origin:center;
    animation:spread .35s ease-out both;
  }

  /* ---------- Caixa de entrega ---------- */
  .box-overlay{
    position:fixed;inset:0;z-index:10;
    display:grid;place-items:center;
    background:rgba(255,248,240,.8);backdrop-filter:blur(3px);
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .box-overlay.show{opacity:1;pointer-events:all}
  .box svg{width:min(60vw,280px);height:auto;overflow:visible}
  @keyframes boxIn{
    from{transform:scale(.6) translateY(30px);opacity:0}
    to{transform:none;opacity:1}
  }
  @keyframes lidDown{
    from{transform:translateY(-80px) rotate(-18deg);opacity:0}
    to{transform:none;opacity:1}
  }
  .box-overlay.show .box{animation:boxIn .5s var(--elastico) both}
  .box-overlay.show .lid{
    transform-box:fill-box;transform-origin:center;
    animation:lidDown .6s .35s var(--elastico) both;
  }

  .toast{
    position:fixed;left:50%;bottom:24px;z-index:20;
    transform:translate(-50%,160px);
    background:#fff;border-radius:999px;padding:12px 22px;
    box-shadow:var(--sombra);font-weight:500;
    transition:transform .45s var(--elastico);
    white-space:nowrap;
  }
  .toast.show{transform:translate(-50%,0)}

  /* ---------- Tela inicial ---------- */
  .start{
    position:fixed;inset:0;z-index:30;
    display:grid;place-items:center;
    padding:24px;
    background:
      radial-gradient(circle at 20% 15%, #FFFFFF 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, var(--pessego) 0%, transparent 50%),
      var(--creme);
    transition:opacity .6s ease, transform .6s var(--elastico), visibility .6s;
    overflow:hidden;
  }
  .start.gone{opacity:0;transform:scale(1.06);visibility:hidden;pointer-events:none}
  .start-card{
    display:flex;flex-direction:column;align-items:center;gap:14px;
    text-align:center;position:relative;z-index:1;
  }
  .start-art{
    width:min(56vw,260px);height:auto;
    animation:floaty 4s ease-in-out infinite;
    filter:drop-shadow(0 16px 18px rgba(74,59,50,.18));
  }
  @keyframes floaty{
    0%,100%{transform:translateY(0) rotate(-2deg)}
    50%{transform:translateY(-10px) rotate(2deg)}
  }
  .start-title{
    font-size:clamp(2.2rem,7vw,3.4rem);font-weight:700;line-height:1;
    color:var(--cafe);
    text-shadow:0 3px 0 #fff, 0 8px 18px rgba(74,59,50,.15);
  }
  .start-title span{color:#D98A9A}
  .start-sub{font-size:1rem;font-weight:600;color:var(--cafe-suave)}
  .start-btn{
    margin-top:10px;border:none;cursor:pointer;
    border-radius:999px;padding:16px 54px;
    font-size:1.4rem;font-weight:700;color:var(--cafe);
    background:var(--rosa);
    box-shadow:0 8px 0 #E08E9D, 0 18px 30px -12px rgba(74,59,50,.45);
    transition:transform .2s var(--elastico), box-shadow .2s;
  }
  .start-btn:hover{transform:translateY(-3px);box-shadow:0 11px 0 #E08E9D, 0 22px 30px -12px rgba(74,59,50,.45)}
  .start-btn:active{transform:translateY(6px);box-shadow:0 2px 0 #E08E9D}
  .start-deco{position:absolute;inset:0;pointer-events:none;z-index:0}
  .start-deco span{
    position:absolute;font-size:1.4rem;opacity:.7;
    animation:rise 6s linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(20px) scale(.8);opacity:0}
    20%{opacity:.8}
    100%{transform:translateY(-110vh) scale(1.1);opacity:0}
  }

  /* ---------- Aviso: girar o celular (plano B, só em pé) ---------- */
  .rotate-overlay{
    position:fixed;inset:0;z-index:40;
    display:none;place-items:center;
    padding:24px;text-align:center;
    background:
      radial-gradient(circle at 20% 15%, #FFFFFF 0%, transparent 40%),
      radial-gradient(circle at 85% 85%, var(--pessego) 0%, transparent 50%),
      var(--creme);
  }
  .rotate-card{display:flex;flex-direction:column;align-items:center;gap:14px}
  .rotate-phone{
    width:70px;height:110px;border-radius:18px;
    border:4px solid var(--cafe-suave);background:var(--manteiga);
    display:grid;place-items:center;
    animation:turn 2.4s var(--elastico) infinite;
  }
  .rotate-phone svg{width:34px;height:34px}
  @keyframes turn{
    0%,20%{transform:rotate(0)}
    50%,70%{transform:rotate(-90deg)}
    100%{transform:rotate(0)}
  }
  .rotate-title{font-size:1.6rem;font-weight:700;color:var(--cafe)}
  .rotate-sub{font-size:1rem;font-weight:600;color:var(--cafe-suave);max-width:260px}

  /* ---------- Responsivo: celular em pé e tablet ---------- */
  @media (max-width:900px) and (orientation:portrait){
    body{overflow:auto}
    .app{height:auto;min-height:100dvh;grid-template-columns:1fr;grid-template-rows:auto}
    .counter{overflow:visible}
    .comanda-wrap{overflow:visible}
    .comanda{max-width:360px;width:100%;margin:0 auto}
    .table{width:min(88vw,400px)}
    .pot-grid{overflow:visible;grid-template-columns:repeat(4,1fr)}
    .pot svg{width:52px;height:52px}
    .toast{bottom:16px}
  }
  @media (max-width:480px) and (orientation:portrait){
    .app{padding:12px}
    .pot-grid{grid-template-columns:repeat(3,1fr)}
    .seg{padding:7px 10px;font-size:.82rem}
  }

  /* ---------- Celular deitado: 3 colunas compactas, sem rolagem geral ---------- */
  @media (orientation:landscape) and (max-height:550px){
    .app{
      height:100dvh;min-height:0;
      grid-template-columns:215px 1fr 225px;
      grid-template-rows:auto 1fr;
      gap:8px;
      padding:8px 12px;
      overflow:hidden;
    }
    body{overflow:hidden}
    .top{gap:8px}
    .brand{font-size:1.1rem;gap:6px}
    .brand svg{width:26px;height:26px}

    .panel{padding:8px;border-radius:18px}
    .counter{overflow:hidden}
    .comanda-wrap{padding:2px 2px 2px}

    /* Comanda compacta */
    .comanda{padding:12px 10px 10px;border-radius:14px}
    .comanda-head{font-size:.62rem;margin-bottom:2px}
    .avatar{width:64px;height:64px;border-width:3px;margin-top:2px}
    .duo{margin-top:2px;gap:2px}
    .duo .avatar{width:52px;height:52px}
    .sparkles svg{width:12px;height:12px}
    .sparkles .heart{width:14px;height:14px}
    .skins{margin-top:4px}
    .skin-row{margin-top:3px;gap:4px}
    .skin-row > span{font-size:.55rem}
    .skin-pill{padding:2px 7px;font-size:.6rem}
    .client{font-size:.95rem;margin-top:4px}
    .bubble{font-size:.7rem;line-height:1.25;padding:6px 8px;margin-top:8px}
    .bubble::before{border-width:6px;margin-left:-6px;top:-6px}
    .items{margin-top:4px}
    .items li{font-size:.7rem;padding:3px 0;gap:6px}
    .items i{width:11px;height:11px;border-width:1.5px}
    .items li.done i{box-shadow:inset 0 0 0 2px #A8D5B5}
    .items em{font-size:.55rem;padding:0 5px}
    .nav{padding-top:6px}
    .pill{padding:5px 12px;font-size:.72rem;box-shadow:0 3px 0 rgba(74,59,50,.12)}

    /* Bancada */
    .bench{gap:5px}
    .segmented{padding:2px;gap:2px}
    .seg{padding:4px 8px;font-size:.66rem}
    .table{width:min(100%, 56dvh, 230px)}
    .table::before{inset:6%}
    .hint{font-size:.62rem;min-height:0;line-height:1.2}
    .actions{gap:6px}
    .btn{padding:6px 12px;font-size:.72rem;box-shadow:0 3px 0 rgba(74,59,50,.14)}

    /* Potes */
    .pantry{gap:6px}
    .tabs{gap:4px}
    .tab{padding:4px 2px;font-size:.6rem;border-radius:10px}
    .pot-grid{gap:5px;padding:2px 1px 4px;grid-template-columns:repeat(3,1fr)}
    .pot{padding:4px 2px;border-radius:12px;gap:2px;box-shadow:0 3px 6px -4px rgba(74,59,50,.4)}
    .pot svg{width:38px;height:38px}
    .pot span{font-size:.65rem;line-height:1}
    .badge{font-size:.5rem;padding:0 4px;top:-4px;right:-2px}

    .toast{bottom:10px;font-size:.8rem;padding:8px 16px}
    .start-title{font-size:2rem}
    .start-sub{font-size:.85rem}
    .start-btn{padding:10px 36px;font-size:1.1rem}
    .start-art{width:150px}
    .start-card{gap:8px}
  }

  /* ---------- Plano B: aviso para girar o celular ---------- */
  @media (max-width:900px) and (orientation:portrait){
    .rotate-overlay{display:grid}
  }

  @media (hover:none){
    .pot:hover,.tab:hover,.seg:hover,.skin-pill:hover,.btn:hover,.start-btn:hover,.pill:hover{transform:none}
  }
</style>
</head>
<body>

<!-- ========== AVISO PARA GIRAR (plano B, só em pé) ========== -->
<section class="rotate-overlay" id="rotateOverlay" aria-live="polite">
  <div class="rotate-card">
    <div class="rotate-phone" aria-hidden="true">
      <svg viewBox="0 0 34 34">
        <circle cx="17" cy="17" r="15" fill="#F4ACB7"/>
        <circle cx="17" cy="17" r="11" fill="#FFF1C1"/>

const SVGNS = 'http://www.w3.org/2000/svg';
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

function seeded(str){
  let s = 0;
  for (const c of str) s = (Math.imul(s, 31) + c.charCodeAt(0)) | 0;
  return () => {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function sprite(type, color, r){
  switch(type){
    case 'blob':
      return `<ellipse rx="${(7 + r()*4).toFixed(1)}" ry="${(5 + r()*3).toFixed(1)}" fill="${color}" stroke="#E6D3B8" stroke-width=".9"/>`;
    case 'slice':
      return `<circle r="7" fill="${color}" stroke="#C4705E" stroke-width="1.2"/>
              <circle cx="-2.5" cy="-1.5" r="1.1" fill="#B8604E"/>
              <circle cx="2.5" cy="1.8" r="1.1" fill="#B8604E"/>
              <circle cx="1" cy="-3.2" r=".9" fill="#B8604E"/>`;
    case 'leaf':
      return `<path d="M-8 0Q0-9 8 0Q0 9-8 0Z" fill="${color}" stroke="#86B895" stroke-width=".8"/>
              <path d="M-6 0H6" stroke="#86B895" stroke-width=".7"/>`;
    case 'cherry':
      return `<circle r="6" fill="${color}"/><circle cx="-2" cy="-2" r="1.8" fill="#fff" opacity=".6"/>`;
    case 'stick':
      return `<rect x="-9" y="-2.2" width="18" height="4.4" rx="1.6" fill="${color}" stroke="#D9A94A" stroke-width=".8"/>`;
    case 'drip':
      return `<path d="M-8-4Q0-8 8-4Q8 4 4 8Q0 2-4 8Q-8 4-8-4Z" fill="${color}"/>`;
    case 'bacon':
      return `<rect x="-8" y="-3.2" width="16" height="6.4" rx="3" fill="${color}" stroke="#C97B78" stroke-width=".8"/>
              <path d="M-4-3V3M0-3V3M4-3V3" stroke="#C97B78" stroke-width=".7" opacity=".7"/>`;
    case 'cube':
      return `<rect x="-5" y="-5" width="10" height="10" rx="2.4" fill="${color}" stroke="#E07F63" stroke-width=".9"/>`;
    case 'rod':
      return `<rect x="-8" y="-1.4" width="16" height="2.8" rx="1.4" fill="${color}"/>`;
    case 'seed':
      return `<ellipse rx="3" ry="2" fill="${color}" stroke="#E0C49A" stroke-width=".5"/>`;
    case 'drizzle':
      return `<path d="M-14 0Q-7-6 0 0T14 0" fill="none" stroke="${color}" stroke-width="3.4" stroke-linecap="round"/>`;
    case 'grape':
      return `<circle r="4.6" fill="${color}" stroke="#8DBA7A" stroke-width=".8"/>
              <circle cx="-1.5" cy="-1.5" r="1" fill="#fff" opacity=".6"/>`;
    case 'berry':
      return `<path d="M0-6Q6-8 7 0Q6 7 0 8Q-6 7-7 0Q-6-8 0-6Z" fill="${color}"/>
              <circle cx="-3" cy="-1" r=".7" fill="#fff"/><circle cx="2" cy="1" r=".7" fill="#fff"/>`;
    default:
      return '';
  }
}

function potArt(it){
  const body = it.layer === 'base'
    ? `<circle r="8" fill="${it.color}" stroke="#D8C3A8" stroke-width="1"/>`
    : sprite(it.sprite, it.color, seeded(it.sprite + it.name));
  return `
    <path d="M-19-2H19Q18 16 0 17Q-18 16-19-2Z" fill="#fff" stroke="#D8C3A8" stroke-width="1.2"/>
    <ellipse cx="0" cy="-2" rx="19" ry="3.5" fill="#EFE3D2"/>
    <g transform="translate(0 -3) scale(1.25)">${body}</g>`;
}

const RADIUS = 150;
const CENTER = 200;
const MIN_STEP = 16;

function toSvgPoint(clientX, clientY){
  const pt = $svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const ctm = $svg.getScreenCTM();
  if (!ctm) return null;
  const p = pt.matrixTransform(ctm.inverse());
  return { x: p.x, y: p.y };
}

function insideArea(p, at){
  const dx = p.x - CENTER, dy = p.y - CENTER;
  if (dx*dx + dy*dy > RADIUS*RADIUS) return false;
  if (at === 'left')  return p.x <= CENTER;
  if (at === 'right') return p.x >= CENTER;
  return true;
}

function renderTable(){
  const entries = [...state.board.values()];
  const bases   = entries.filter(e => ITEMS[e.id].layer === 'base');
  const cheese  = entries.filter(e => ITEMS[e.id].layer === 'queijo');
  const tops    = entries.filter(e => ITEMS[e.id].layer === 'cobertura');

  const baseFull = bases.find(e => e.at === 'full');
  const baseL    = bases.find(e => e.at === 'left');
  const baseR    = bases.find(e => e.at === 'right');

  let baseSvg = '';
  if (baseFull){
    baseSvg = `<circle id="liq-full" class="spread" cx="200" cy="200" r="150" fill="${ITEMS[baseFull.id].color}"/>`;
  } else {
    if (baseL) baseSvg += `<path id="liq-left" class="spread" d="M200 50A150 150 0 0 0 200 350Z" fill="${ITEMS[baseL.id].color}"/>`;
    if (baseR) baseSvg += `<path id="liq-right" class="spread" d="M200 50A150 150 0 0 1 200 350Z" fill="${ITEMS[baseR.id].color}"/>`;
  }
  if (baseSvg) baseSvg += `<circle cx="200" cy="200" r="150" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="6"/>`;

  const piecesOf = list => list.map(e => e.pieces.map(p => p.html).join('')).join('');

  const divisoria = entries.some(e => e.at !== 'full')
    ? `<line x1="200" y1="36" x2="200" y2="364" stroke="#fff" stroke-opacity=".8" stroke-width="3" stroke-dasharray="7 7" stroke-linecap="round"/>`
    : '';

  $svg.innerHTML = `
    <defs>
      <radialGradient id="massa" cx=".4" cy=".35" r=".7">
        <stop offset="0" stop-color="#FBEBC9"/>
        <stop offset="1" stop-color="#F0D29B"/>
      </radialGradient>
    </defs>
    <circle cx="200" cy="200" r="190" fill="#E7B878"/>
    <circle cx="200" cy="200" r="178" fill="none" stroke="#F6DDB0" stroke-width="4" opacity=".8"/>
    <circle cx="200" cy="200" r="168" fill="url(#massa)"/>
    <g id="layer-base">${baseSvg}</g>
    <g id="layer-queijo">${piecesOf(cheese)}</g>
    <g id="layer-cobertura">${piecesOf(tops)}</g>
    <g id="layer-divisoria">${divisoria}</g>`;
}

function appendSolidPiece(entry, piece){
  const layerId = ITEMS[entry.id].layer === 'queijo' ? 'layer-queijo' : 'layer-cobertura';
  const layer = $svg.querySelector('#' + layerId);
  const wrap = document.createElementNS(SVGNS, 'g');
  wrap.setAttribute('transform', `translate(${piece.x.toFixed(1)} ${piece.y.toFixed(1)}) rotate(${piece.rot.toFixed(0)}) scale(${piece.s.toFixed(2)})`);
  wrap.innerHTML = `<g class="pop">${piece.sp}</g>`;
  layer.appendChild(wrap);
}

function paintLiquid(entry){
  const baseLayer = $svg.querySelector('#layer-base');
  const id = `liq-${entry.at}`;
  let el = baseLayer.querySelector('#' + id);
  if (!el){
    el = document.createElementNS(SVGNS, entry.at === 'full' ? 'circle' : 'path');
    el.setAttribute('id', id);
    el.setAttribute('class', 'spread');
    baseLayer.appendChild(el);
  }
  if (entry.at === 'full'){
    el.setAttribute('cx', 200); el.setAttribute('cy', 200); el.setAttribute('r', 150);
  } else {
    el.setAttribute('d', entry.at === 'left'
      ? 'M200 50A150 150 0 0 0 200 350Z'
      : 'M200 50A150 150 0 0 1 200 350Z');
  }
  el.setAttribute('fill', ITEMS[entry.id].color);
}

function removeLiquidFromSvg(at){
  const el = $svg.querySelector(`#liq-${at}`);
  if (el) el.remove();
}

function renderTabs(){
  $tabs.innerHTML = TABS.map(t =>
    `<button class="tab ${t.id === state.tab ? 'on' : ''}" data-tab="${t.id}">${t.label}</button>`
  ).join('');
}

function renderPots(){
  $pots.innerHTML = Object.entries(ITEMS)
    .filter(([, it]) => it.tab === state.tab)
    .map(([id, it]) => {
      const ats = halvesOf(id);
      const on = ats.length > 0;
      const active = state.activeItem === id;
      return `
        <button class="pot ${on ? 'on' : ''} ${active ? 'active' : ''}" data-tab="${it.tab}" data-id="${id}"
                aria-pressed="${active}" aria-label="${it.name}">
          ${on ? `<b class="badge">${badgeText(ats)}</b>` : ''}
          <svg viewBox="-22 -22 44 44" aria-hidden="true">${potArt(it)}</svg>
          <span>${it.name}</span>

}

function renderSegmented(){
  $modo.querySelectorAll('.seg').forEach(b =>
    b.classList.toggle('on', b.dataset.at === state.at));
}

function renderHint(){
  if (!state.activeItem){
    $hint.textContent = 'Toque em um pote para escolher o ingrediente.';
  } else {
    const isLiquid = ITEMS[state.activeItem].kind === 'liquido';
    $hint.textContent = isLiquid
      ? `Toque na massa para pintar com ${ITEMS[state.activeItem].name.toLowerCase()}.`
      : `Arraste sobre a massa para espalhar ${ITEMS[state.activeItem].name.toLowerCase()}.`;
  }
  $board.classList.toggle('no-active', !state.activeItem);
}

function avatarHTML(v){
  const sA = SKINS.arthur[state.skins.arthur];
  const sL = SKINS.leticia[state.skins.leticia];

  if (v.tipo === 'random'){
    return `<div class="avatar" style="background:${v.look.bg}">${portrait(v.look)}</div>`;
  }
  if (v.tipo === 'arthur'){
    return `<div class="avatar" style="background:${sA.bg}">${drawArthur(ARTHUR_CFG, sA)}</div>`;
  }
  if (v.tipo === 'leticia'){
    return `<div class="avatar" style="background:${sL.bg}">${drawLeticia(LETICIA_CFG, sL)}</div>`;
  }
  return `
    <div class="duo">
      <div class="avatar" style="background:${sA.bg}">${drawArthur(ARTHUR_CFG, sA)}</div>
      ${SPARKLES_HTML}
      <div class="avatar" style="background:${sL.bg}">${drawLeticia(LETICIA_CFG, sL)}</div>
    </div>`;
}

function renderSkins(){
  const v = state.visita;
  if (v.tipo === 'random'){ $skins.innerHTML = ''; return; }

  const linha = (char, label) => `
    <div class="skin-row">
      <span>${label}</span>
      ${Object.entries(SKINS[char]).map(([k, s]) =>
        `<button class="skin-pill ${state.skins[char] === k ? 'on' : ''}"
                 data-char="${char}" data-skin="${k}">${s.nome}</button>`).join('')}
    </div>`;

  if (v.tipo === 'dupla'){
    const juntos = state.skins.arthur === state.skins.leticia ? state.skins.arthur : null;
    $skins.innerHTML =
      linha('arthur', 'Arthur') +
      linha('leticia', 'Letícia') +
      `<div class="skin-row">
         <span>Tema juntos</span>
         ${Object.entries(SKINS.arthur).map(([k, s]) =>
           `<button class="skin-pill ${juntos === k ? 'on' : ''}"
                    data-char="both" data-skin="${k}">${s.nome}</button>`).join('')}
       </div>`;
  } else {
    $skins.innerHTML = linha(v.tipo, v.tipo === 'arthur' ? 'Arthur' : 'Letícia');
  }
}

function isDone(id, at){
  if (state.board.has(keyOf(id, 'full'))) return true;
  return state.board.has(keyOf(id, at));
}

function renderOrder(){
  const v = state.visita;
  $avatar.innerHTML = avatarHTML(v);
  $client.textContent = v.nome;
  $say.textContent = v.pedido.say;
  $ticket.textContent = `Pedido nº ${String(state.visitas).padStart(3, '0')}`;
  $items.innerHTML = v.pedido.items.map(({ id, at }) => {
    const done = isDone(id, at);
    const tag = at === 'full' ? '' : `<em>${at === 'left' ? 'E' : 'D'}</em>`;
    return `<li class="${done ? 'done' : ''}"><i></i>${ITEMS[id].name}${tag}</li>`;
  }).join('');
}

function renderAll(){
  renderTabs();
  renderPots();
  renderSegmented();
  renderHint();
  renderTable();
  renderOrder();
  renderSkins();
}

function refreshSidebar(){
  renderPots();
  renderOrder();
  renderHint();
}

function pickVisit(){
  const roll = Math.random();
  if (roll < 0.10){
    return { tipo:'arthur', nome:CLIENTES_VIP.arthur.nome, pedido:pick(CLIENTES_VIP.arthur.pedidos) };
  }
  if (roll < 0.20){
    return { tipo:'leticia', nome:CLIENTES_VIP.leticia.nome, pedido:pick(CLIENTES_VIP.leticia.pedidos) };
  }
  if (roll < 0.30){
    return { tipo:'dupla', nome:CLIENTES_VIP.dupla.nome, pedido:pick(CLIENTES_VIP.dupla.pedidos) };
  }
  const c = pick(RANDOM_CLIENTS);
  return { tipo:'random', nome:c.nome, look:c.look, pedido:pick(c.pedidos) };
}

function novaVisita(){
  state.visita = pickVisit();
  state.visitas++;
  state.skins = { arthur:'casual', leticia:'casual' };
  state.board.clear();
  renderAll();
}

function selectItem(id){
  state.activeItem = state.activeItem === id ? null : id;
  renderPots();
  renderHint();
}

  const id = state.activeItem;
  const at = state.at;
  const k = keyOf(id, at);

  if (state.lastPoint){
    const dx = p.x - state.lastPoint.x, dy = p.y - state.lastPoint.y;
    if (dx*dx + dy*dy < MIN_STEP*MIN_STEP) return;
  }

  const r = seeded(k + '|' + state.board.size + '|' + Math.round(p.x) + '|' + Math.round(p.y));
  const it = ITEMS[id];
  const piece = {
    x: p.x + (r() - 0.5) * 6,
    y: p.y + (r() - 0.5) * 6,
    rot: r() * 360,
    s: (it.scale ?? 1) * (0.85 + r() * 0.35),
    sp: sprite(it.sprite, it.color, r),
  };

  const dx = piece.x - CENTER, dy = piece.y - CENTER;
  if (dx*dx + dy*dy > RADIUS*RADIUS) return;

  if (!state.board.has(k)){
    state.board.set(k, { id, at, pieces:[] });
  }
  const entry = state.board.get(k);
  entry.pieces.push(piece);
  piece.html = `<g transform="translate(${piece.x.toFixed(1)} ${piece.y.toFixed(1)}) rotate(${piece.rot.toFixed(0)}) scale(${piece.s.toFixed(2)})"><g>${piece.sp}</g></g>`;
  appendSolidPiece(entry, piece);

  state.lastPoint = { x:p.x, y:p.y };
  refreshSidebar();
}

function paintLiquidAt(p){
  const id = state.activeItem;
  const at = state.at;

  for (const [k, e] of [...state.board.entries()]){
    if (ITEMS[e.id].layer === 'base' &&
        (e.at === 'full' || at === 'full' || e.at === at) && k !== keyOf(id, at)){
      state.board.delete(k);
      removeLiquidFromSvg(e.at);
    }
  }

  const k = keyOf(id, at);
  if (!state.board.has(k)){
    state.board.set(k, { id, at, pieces:[], liquidDone:true });
    paintLiquid(state.board.get(k));
  }
  refreshSidebar();
}

let activePointerId = null;

$board.addEventListener('pointerdown', e => {
  if (!state.activeItem) return;
  const p = toSvgPoint(e.clientX, e.clientY);
  if (!p || !insideArea(p, state.at)) return;

  e.preventDefault();
  $board.setPointerCapture?.(e.pointerId);
  activePointerId = e.pointerId;
  state.dragging = true;
  state.lastPoint = null;

  if (ITEMS[state.activeItem].kind === 'liquido'){
    paintLiquidAt(p);
    state.dragging = false;
  } else {
    placeSolidAt(p);
  }
});

$board.addEventListener('pointermove', e => {
  if (!state.dragging || e.pointerId !== activePointerId) return;
  const p = toSvgPoint(e.clientX, e.clientY);
  if (!p || !insideArea(p, state.at)) return;
  placeSolidAt(p);
});

function endDrag(e){
  if (e && e.pointerId !== activePointerId) return;
  state.dragging = false;
  state.lastPoint = null;
  activePointerId = null;
}
$board.addEventListener('pointerup', endDrag);
$board.addEventListener('pointercancel', endDrag);
$board.addEventListener('pointerleave', endDrag);

/* ---------- Entrega e limpeza ---------- */

function clearBoard(){
  state.board.clear();
  renderTable();
  refreshSidebar();
}

let toastTimer;
function toast(msg){
  $toast.textContent = msg;
  $toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $toast.classList.remove('show'), 2400);
}

function deliver(){
  if (!state.board.size) return toast('A massa ainda está vazia. Que tal um molho?');
  const name = state.visita.nome;
  $overlay.classList.add('show');
  setTimeout(() => {
    $overlay.classList.remove('show');
    novaVisita();
    toast(`Pizza entregue para ${name}! ♡`);
  }, 2000);
}

/* =========================================================
   12. TELA CHEIA E ROTAÇÃO (Android)
   ========================================================= */

async function enterFullscreenAndLandscape(){
  try {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen){
      await el.requestFullscreen().catch(() => {});
    }
  } catch (_) { /* navegador não suporta ou bloqueou */ }

  try {
    if (screen.orientation && screen.orientation.lock){
      await screen.orientation.lock('landscape').catch(() => {});
    }
  } catch (_) { /* travar orientação não permitido */ }
}

/* =========================================================
   13. TELA INICIAL
   ========================================================= */

function buildStartDeco(){
  const deco = $('startDeco');
  const symbols = ['♡', '✦', '♡', '✧', '♡'];
  for (let i = 0; i < 14; i++){
    const s = document.createElement('span');
    s.textContent = symbols[i % symbols.length];
    s.style.left = (Math.random() * 100) + '%';
    s.style.bottom = (-10 + Math.random() * 20) + '%';
    s.style.color = i % 2 ? '#F4ACB7' : '#FFF1C1';
    s.style.animationDelay = (Math.random() * 6) + 's';
    s.style.animationDuration = (5 + Math.random() * 4) + 's';
    deco.appendChild(s);
  }
}

function startGame(){
  enterFullscreenAndLandscape();
  $('start').classList.add('gone');
  $('app').classList.remove('hidden');
}

/* =========================================================
   14. EVENTOS
   ========================================================= */

$pots.addEventListener('click', e => {
  const b = e.target.closest('.pot');
  if (b) selectItem(b.dataset.id);
});

$tabs.addEventListener('click', e => {
  const b = e.target.closest('.tab');
  if (b){
    state.tab = b.dataset.tab;
    renderTabs();
    renderPots();
  }
});

$modo.addEventListener('click', e => {
  const b = e.target.closest('.seg');
  if (b){
    state.at = b.dataset.at;
    renderSegmented();
  }
});

$skins.addEventListener('click', e => {
  const b = e.target.closest('.skin-pill');
  if (!b) return;
  if (b.dataset.char === 'both'){
    state.skins.arthur = b.dataset.skin;
    state.skins.leticia = b.dataset.skin;
  } else {
    state.skins[b.dataset.char] = b.dataset.skin;
  }
  renderOrder();
  renderSkins();
});

$('nextClient').addEventListener('click', novaVisita);
$('clear').addEventListener('click', clearBoard);
$('deliver').addEventListener('click', deliver);
$('playBtn').addEventListener('click', startGame);

/* ---------- Inicialização ---------- */
buildStartDeco();
novaVisita();
</script>
